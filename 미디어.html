<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA 오늘의 천문/소행성 사진 (APOD)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: #0b3d91;
            color: #ffffff;
            line-height: 1.6;
        }
        .container {
            background-color: #105b70;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .subtitle {
            text-align: center;
            color: #dddddd;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        input[type="date"] {
            padding: 12px 15px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background-color: #fc3d21;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #e0321a;
        }
        #loading {
            text-align: center;
            display: none;
            font-size: 18px;
            padding: 20px;
        }
        .media-card {
            background-color: #ffffff;
            color: #222222;
            padding: 25px;
            border-radius: 10px;
            display: none;
        }
        .media-title {
            margin-top: 0;
            font-size: 1.5rem;
            color: #0b3d91;
            border-bottom: 2px solid #105b70;
            padding-bottom: 10px;
        }
        .media-date {
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 15px;
        }
        .media-container {
            width: 100%;
            text-align: center;
            margin: 20px 0;
        }
        .media-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .media-container iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 8px;
        }
        .explanation {
            text-align: justify;
            font-size: 1rem;
            color: #333333;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #105b70;
        }
        .copyright-text {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #777;
            font-style: italic;
        }
        .hd-link {
            display: inline-block;
            margin-top: 15px;
            color: #0b3d91;
            font-weight: bold;
            text-decoration: none;
        }
        .hd-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>NASA 오늘의 천문/소행성 사진</h1>
    <p class="subtitle">날짜를 선택하여 우주 및 소행성 사진과 설명을 확인하세요.</p>

    <div class="search-box">
        <input type="date" id="searchDate">
        <button onclick="fetchApod()">조회하기</button>
    </div>

    <div id="loading">NASA 우주 이미지를 불러오는 중입니다...</div>

    <div id="mediaCard" class="media-card">
        <h2 id="mediaTitle" class="media-title"></h2>
        <div id="mediaDate" class="media-date"></div>
        <div id="mediaViewer" class="media-container"></div>
        <div id="copyright" class="copyright-text"></div>
        <h3>사진 설명</h3>
        <p id="explanation" class="explanation"></p>
        <a id="hdUrl" class="hd-link" target="_blank" rel="noopener noreferrer">고해상도 이미지 보기 ↗</a>
    </div>
</div>

<script>
    // 오늘 날짜 기본 설정
    document.getElementById('searchDate').value = new Date().toISOString().substring(0, 10);

    // 페이지 로드 시 오늘 사진 자동 호출
    window.onload = function() {
        fetchApod();
    };

    async function fetchApod() {
        const apiKey = 'zM9hJKluf45TdgYqEl7HeOHHgnfHLxi2TEvlv9ZA';
        const dateInput = document.getElementById('searchDate').value;
        const loadingDiv = document.getElementById('loading');
        const mediaCard = document.getElementById('mediaCard');

        if (!dateInput) {
            alert('날짜를 선택해 주세요.');
            return;
        }

        mediaCard.style.display = 'none';
        loadingDiv.style.display = 'block';

        const url = `https://api.nasa.gov/planetary/apod?date=${dateInput}&api_key=${apiKey}`;

        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('데이터를 불러오는데 실패했습니다.');
            }

            const data = await response.json();

            // 데이터 출력 처리
            document.getElementById('mediaTitle').innerText = data.title;
            document.getElementById('mediaDate').innerText = `촬영/공개 일자: ${data.date}`;
            document.getElementById('explanation').innerText = data.explanation;

            // 저작권 정보 표기
            const copyrightDiv = document.getElementById('copyright');
            if (data.copyright) {
                copyrightDiv.innerText = `ⓒ Credit: ${data.copyright.trim()}`;
                copyrightDiv.style.display = 'block';
            } else {
                copyrightDiv.style.display = 'none';
            }

            // 미디어 타입 처리 (이미지 vs 영상)
            const mediaViewer = document.getElementById('mediaViewer');
            const hdUrlAnchor = document.getElementById('hdUrl');

            if (data.media_type === 'image') {
                mediaViewer.innerHTML = `<img src="${data.url}" alt="${data.title}">`;
                if (data.hdurl) {
                    hdUrlAnchor.href = data.hdurl;
                    hdUrlAnchor.style.display = 'inline-block';
                } else {
                    hdUrlAnchor.style.display = 'none';
                }
            } else if (data.media_type === 'video') {
                mediaViewer.innerHTML = `<iframe src="${data.url}" allowfullscreen></iframe>`;
                hdUrlAnchor.style.display = 'none';
            } else {
                mediaViewer.innerHTML = '<p>지원하지 않는 미디어 형식입니다.</p>';
                hdUrlAnchor.style.display = 'none';
            }

            loadingDiv.style.display = 'none';
            mediaCard.style.display = 'block';

        } catch (error) {
            loadingDiv.style.display = 'none';
            alert(`오류 발생: ${error.message}`);
        }
    }
</script>

</body>
</html>
